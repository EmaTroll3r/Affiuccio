{% import game_name ~ '/config.html' as conf %}

<!DOCTYPE html>
<html>
    <head>
        <title>404 - Page Not Found</title>
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
        <meta name="google" content="notranslate">
        <meta name="theme-color" content="{{ conf.g_themeColor | default('#0c0c12') }}">
        <meta name="color-scheme" content="dark">
        <meta name="application-name" content="{{ conf.g_title | default('Generic Game') }}">
        <link rel="manifest" href="{{ url_for('static', filename=conf.g_folder | trim ~ '/manifest.webmanifest') }}">
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='common/404.css') }}">
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename=conf.g_folder | trim ~ '/styles.css') }}">
		<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='common/style_index.css') }}">
		<link rel="icon" type="image/png" href="{{ url_for('static', filename=conf.g_folder | trim ~ '/images/' ~ conf.g_favicon) }}?v={{ conf.g_folder }}">
		<link rel="shortcut icon" href="{{ url_for('static', filename=conf.g_folder | trim ~ '/images/' ~ conf.g_favicon) }}?v={{ conf.g_folder }}">
		<link rel="apple-touch-icon" href="{{ url_for('static', filename=conf.g_folder | trim ~ '/images/' ~ conf.g_favicon) }}?v={{ conf.g_folder }}">
		<meta property="og:image" content="{{ request.url_root[:-1] ~ url_for('static', filename=conf.g_folder | trim ~ '/images/' ~ conf.g_favicon) }}">
    </head>



    <body>
        <div class="game-decoration card1"></div>
        <div class="game-decoration card2"></div>
        <div class="game-decoration card3"></div>
        <div class="game-decoration card4"></div>
        
        <h1 class="write">404</h1>
        
        <div class="error-container">
            <div class="write">
                <span id="sorry-message">We're sorry</span>
                <span>The page you are looking for does not exist</span>
            </div>
        </div>

        <button id="home-button" onclick="location.href='/{{ conf.g_endpoint}}'">Go to Home</button>


        <script src="https://cdn.socket.io/4.2.0/socket.io.min.js" crossorigin="anonymous"></script>
    </body>
</html>
