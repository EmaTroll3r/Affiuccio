{% import game_name ~ '/config.html' as conf %}

<!DOCTYPE html>
<html>
    <head>
        <title>404 - Page Not Found</title>
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
        <meta name="google" content="notranslate">
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='home/404.css') }}">
		<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename=conf.g_folder | trim ~ '/style_index.css') }}">
		<link rel="icon" type="image/png" href="{{ url_for('static', filename=conf.g_folder | trim ~ '/images/' ~ conf.g_favicon) }}">
    </head>



    <body>
        <!-- Decorazioni per SosOnline -->
        <div class="game-decoration card1"></div>
        <div class="game-decoration card2"></div>
        <div class="game-decoration card3"></div>
        <div class="game-decoration card4"></div>
        
        <h1 class="write">404</h1>
        
        <div class="error-container">
            <div class="write">
                <span id="sorry-message">We're sorry</span>
                <span>The page you are looking for does not exist</span>
            </div>
        </div>

        <button id="home-button" onclick="location.href='/{{ conf.g_endpoint}}'">Go to Home</button>


        <script src="https://cdn.socket.io/4.2.0/socket.io.min.js" crossorigin="anonymous"></script>
    </body>
</html>
